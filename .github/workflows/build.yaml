name: Release - Piko Lite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ vars.GPG_FINGERPRINT }}

      - name: Try building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_OPTS: -Dorg.gradle.caching=true
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p bins
          uv run main.py

      - name: Update patches-bundle.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          XVER=${TAG%%-*}
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S)
          REPO="${{ github.repository }}"
          cat > patches-bundle.json <<EOF
          {
            "version": "${XVER}",
            "download_url": "https://github.com/${REPO}/releases/download/${TAG}/patches.mpp",
            "created_at": "${NOW}",
            "description": "Piko x-lite patch bundle for Morphe (${TAG}).",
            "signature_download_url": "https://github.com/${REPO}/releases/download/${TAG}/patches.mpp.asc"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: update patches-bundle.json for ${TAG}" || echo "no changes"
          git push
